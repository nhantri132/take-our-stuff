<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Keeps the site out of search engines (it's still reachable by anyone with the link) -->
  <meta name="robots" content="noindex, nofollow">
  <!-- Apply a saved dark-mode choice before the page draws, so it doesn't flash light first -->
  <script>try { if (localStorage.getItem("tosp-theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch (_) {}</script>
  <title>Take Our Stuff Please</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <header class="site-header">
    <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false"></button>
    <h1>Take Our Stuff Please</h1>
    <div class="swatches" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <p class="tagline">Claim whatever you want by writing your name! Whatever isn't will be taken to Goodwill. You can pick up at our house, or we can just bring it the next time we see y'all.</p>

    <div class="countdown" id="countdown" aria-live="polite">
      <span class="countdown-label">Goodwill run in</span>
      <div class="countdown-units">
        <div><span id="cd-days">–</span><small>days</small></div>
        <div><span id="cd-hours">–</span><small>hrs</small></div>
        <div><span id="cd-mins">–</span><small>min</small></div>
        <div><span id="cd-secs">–</span><small>sec</small></div>
      </div>
    </div>
    <p class="closed-banner" id="closed-banner" hidden>Time's up — everything unclaimed is headed to Goodwill.</p>

    <p class="pickup" id="pickup"></p>

    <div class="filters" role="group" aria-label="Filter items">
      <button class="chip is-active" data-filter="all">All</button>
      <button class="chip" data-filter="available">Available</button>
      <button class="chip" data-filter="reserved">Reserved</button>
    </div>
  </header>

  <main>
    <p class="status" id="status">Loading…</p>
    <ul class="grid" id="grid"></ul>
  </main>

  <dialog id="item-dialog">
    <form method="dialog" class="dialog-close-form">
      <button class="dialog-close" aria-label="Close">×</button>
    </form>
    <img id="dlg-img" alt="">
    <div class="dialog-body">
      <h2 id="dlg-name"></h2>
      <p id="dlg-desc"></p>
      <p class="count-note" id="dlg-count" hidden></p>
      <p class="reserved-note" id="dlg-reserved" hidden></p>
      <form id="reserve-form" class="reserve-form">
        <label for="reserve-name" id="reserve-label">Want it? Put your name down:</label>
        <div class="reserve-row">
          <input id="reserve-name" name="name" maxlength="60" autocomplete="name" placeholder="Your name" required>
          <span class="qty-field" id="qty-field" hidden>
            <label for="reserve-qty" class="sr-only">How many</label>
            <input id="reserve-qty" name="qty" type="number" inputmode="numeric" min="1" value="1" aria-label="How many">
          </span>
          <button type="submit" id="reserve-btn">Reserve</button>
        </div>
        <p class="form-msg" id="form-msg" role="status"></p>
      </form>
    </div>
  </dialog>

  <script src="app.js?v=4"></script>
</body>
</html>
